services:
  # Database PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: ubj_nms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ubj_monitoring}
      POSTGRES_USER: ${DB_USERNAME:-ubj_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ubj_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ubj_user} -d ${DB_DATABASE:-ubj_monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ubj_network

  # Laravel Web Application + Reverb WebSocket + Nginx
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubj_nms_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:80"
      - "8080:8080"
    environment:
      APP_NAME: "UBJ Network Monitoring"
      APP_ENV: production
      APP_KEY: ${APP_KEY:-base64:XruF2hHZNnWtVwffdzVdsG4srXnsgg+3iG+RQqskfn0=}
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ubj_monitoring}
      DB_USERNAME: ${DB_USERNAME:-ubj_user}
      DB_PASSWORD: ${DB_PASSWORD:-ubj_password}
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      REVERB_APP_ID: ${REVERB_APP_ID:-174649}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-f53ne5mejghqmjthwhfq}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-iq1occ9rimn7bpbtfiwv}
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-f53ne5mejghqmjthwhfq}
      VITE_REVERB_HOST: "localhost"
      VITE_REVERB_PORT: 8080
      VITE_REVERB_SCHEME: http
      MONITORING_API_URL: "http://web:80"
      MONITORING_API_TOKEN: ${MONITORING_API_TOKEN:-ubj_nms_engine_secret_token_2026}
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - ubj_network

  # High-Concurrency Golang ICMP/SNMP Monitoring Daemon
  engine:
    build:
      context: ./monitoring-engine
      dockerfile: Dockerfile
    container_name: ubj_nms_engine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      API_URL: "http://web:80"
      API_TOKEN: ${MONITORING_API_TOKEN:-ubj_nms_engine_secret_token_2026}
      WORKER_POOL_SIZE: 20
      POLL_INTERVAL_SEC: 30
      PING_COUNT: 3
      PING_TIMEOUT_SEC: 2
      SNMP_TIMEOUT_SEC: 3
      SNMP_RETRIES: 2
    networks:
      - ubj_network

volumes:
  postgres_data:
  storage_data:

networks:
  ubj_network:
    driver: bridge
